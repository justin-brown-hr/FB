<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; background: #1f2229; color: #e6e6e6; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; margin: 0 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #444; border-radius: 6px; background: #2a2e37; color: #e6e6e6; font: inherit; }
  .hint { color: #9aa0aa; font-size: 11px; margin-top: 4px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { padding: 7px 12px; border: 0; border-radius: 6px; cursor: pointer; background: #139ff0; color: #fff; font-weight: 600; }
  button.sec { background: #3a3f4a; }
  h2 { font-size: 13px; margin: 18px 0 0; padding-top: 12px; border-top: 1px solid #333; }
  #tgOut { margin-top: 8px; white-space: pre-wrap; }
  #out { margin-top: 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Bid Assistant B2 (Freelancer) <span id="ver" style="color:#9aa0aa;font-weight:400;font-size:12px"></span></h1>
  <label for="code">Pairing code</label>
  <input id="code" type="text" placeholder="1.2.3.4:8787/abc123…">
  <div class="hint">Paste the code from your VPS. Leave empty if B1 is in this same Chrome.</div>
  <div class="row"><button id="save">Save &amp; check</button><button id="check" class="sec">Check</button></div>
  <div id="out"></div>

  <h2>Telegram alerts</h2>
  <label for="tgToken">Bot token</label>
  <input id="tgToken" type="text" placeholder="123456789:AA…  (from @BotFather)">
  <label for="tgChat">Chat ID</label>
  <input id="tgChat" type="text" placeholder="send /start to your bot, then click Find">
  <div class="row"><button id="tgFind" class="sec">Find chat ID</button><button id="tgSave">Save &amp; send test</button></div>
  <div id="tgOut"></div>

  <h2>Help me support you</h2>
  <div class="row"><button id="capture" class="sec">Capture this page</button></div>
  <div class="hint">Saves the page layout (long texts shortened, no scripts) as a file you can send to Claude, so the extension can be adapted to Freelancer's real pages.</div>
  <script src="popup.js"></script>
</body>
</html>
